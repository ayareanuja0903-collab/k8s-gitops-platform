apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd

spec:
  project: devops-project

  source:
    repoURL: https://github.com/your-org/k8s-gitops-config
    targetRevision: HEAD
    path: staging/product-service

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true